<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001428"/>
      <stop offset="50%" stop-color="#000c1e"/>
      <stop offset="100%" stop-color="#00050d"/>
    </linearGradient>
    <linearGradient id="blade-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Hexagon / Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="#0284c7" stroke-width="4" stroke-opacity="0.4"/>
  <rect width="480" height="480" x="16" y="16" rx="98" fill="none" stroke="#eab308" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Outer Energy Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="14 10" opacity="0.4"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="6 8" opacity="0.3"/>

  <!-- Solo Leveling / Hunter Crest Central Shield -->
  <g filter="url(#cyan-glow)">
    <polygon points="256,70 380,140 380,310 256,430 132,310 132,140" fill="#001833" stroke="url(#blade-blue)" stroke-width="8"/>
  </g>

  <!-- Inner Diamond Core -->
  <polygon points="256,120 340,240 256,360 172,240" fill="#002244" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>

  <!-- Central Hunter Sword / Dagger -->
  <g filter="url(#gold-glow)">
    <!-- Blade Tip & Edge -->
    <polygon points="256,110 274,270 256,290 238,270" fill="url(#gold-accent)"/>
    <polygon points="256,110 264,270 256,285 248,270" fill="#ffffff"/>
    
    <!-- Crossguard Wings -->
    <polygon points="256,290 320,305 310,320 256,310 202,320 192,305" fill="url(#gold-accent)"/>
    
    <!-- Sword Handle & Pommel -->
    <rect x="250" y="310" width="12" height="60" rx="3" fill="#cbd5e1"/>
    <circle cx="256" cy="380" r="14" fill="url(#gold-accent)"/>
    <circle cx="256" cy="380" r="6" fill="#38bdf8"/>
  </g>

  <!-- Level Up / Solo Star Top Accent -->
  <polygon points="256,135 264,155 285,155 268,168 274,188 256,175 238,188 244,168 227,155 248,155" fill="#fef08a" filter="url(#gold-glow)"/>
</svg>
