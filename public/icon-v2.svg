<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffaa" />
      <stop offset="35%" stop-color="#00d0ff" />
      <stop offset="70%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d0ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#8a2be2" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06080d" stop-opacity="0" />
    </radialGradient>
    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#06080d" />
  <circle cx="256" cy="256" r="220" fill="url(#auroraGlow)" />

  <!-- Orbit Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#auroraGrad)" stroke-width="7" filter="url(#glowBlur)" />

  <!-- Constellation Network Lines -->
  <!-- 10 Nodes at radius 160: angles: -90, -54, -18, 18, 54, 90, 126, 162, 198, 234 deg -->
  <g stroke="url(#auroraGrad)" stroke-width="2.5" opacity="0.85">
    <!-- Star Chords (step 3) -->
    <line x1="256.0" y1="96.0" x2="408.2" y2="305.4" />
    <line x1="350.0" y1="126.6" x2="350.0" y2="385.4" />
    <line x1="408.2" y1="206.6" x2="256.0" y2="416.0" />
    <line x1="408.2" y1="305.4" x2="162.0" y2="385.4" />
    <line x1="350.0" y1="385.4" x2="103.8" y2="305.4" />
    <line x1="256.0" y1="416.0" x2="103.8" y2="206.6" />
    <line x1="162.0" y1="385.4" x2="162.0" y2="126.6" />
    <line x1="103.8" y1="305.4" x2="256.0" y2="96.0" />
    <line x1="103.8" y1="206.6" x2="350.0" y2="126.6" />
    <line x1="162.0" y1="126.6" x2="408.2" y2="206.6" />

    <!-- Center spokes -->
    <line x1="256.0" y1="256.0" x2="256.0" y2="96.0" stroke-width="1.8" opacity="0.6" />
    <line x1="256.0" y1="256.0" x2="350.0" y2="126.6" stroke-width="1.8" opacity="0.6" />
    <line x1="256.0" y1="256.0" x2="408.2" y2="206.6" stroke-width="1.8" opacity="0.6" />
    <line x1="256.0" y1="256.0" x2="408.2" y2="305.4" stroke-width="1.8" opacity="0.6" />
    <line x1="256.0" y1="256.0" x2="350.0" y2="385.4" stroke-width="1.8" opacity="0.6" />
    <line x1="256.0" y1="256.0" x2="256.0" y2="416.0" stroke-width="1.8" opacity="0.6" />
    <line x1="256.0" y1="256.0" x2="162.0" y2="385.4" stroke-width="1.8" opacity="0.6" />
    <line x1="256.0" y1="256.0" x2="103.8" y2="305.4" stroke-width="1.8" opacity="0.6" />
    <line x1="256.0" y1="256.0" x2="103.8" y2="206.6" stroke-width="1.8" opacity="0.6" />
    <line x1="256.0" y1="256.0" x2="162.0" y2="126.6" stroke-width="1.8" opacity="0.6" />
  </g>

  <!-- 10 Satellite Nodes -->
  <g fill="url(#auroraGrad)">
    <circle cx="256.0" cy="96.0" r="10" />
    <circle cx="350.0" cy="126.6" r="10" />
    <circle cx="408.2" cy="206.6" r="10" />
    <circle cx="408.2" cy="305.4" r="10" />
    <circle cx="350.0" cy="385.4" r="10" />
    <circle cx="256.0" cy="416.0" r="10" />
    <circle cx="162.0" cy="385.4" r="10" />
    <circle cx="103.8" cy="305.4" r="10" />
    <circle cx="103.8" cy="206.6" r="10" />
    <circle cx="162.0" cy="126.6" r="10" />
  </g>

  <!-- Central Conscious Core (Avatar KAI) -->
  <circle cx="256" cy="256" r="38" fill="url(#auroraGrad)" filter="url(#glowBlur)" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" opacity="0.9" />
</svg>
