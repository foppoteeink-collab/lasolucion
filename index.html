    <meta property="og:description" content="Transforma tu rutina, hábitos y pomodoro en una aventura épica con estética Solo Leveling, misiones, smart recall, bitácora y recompensas." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">

    <script>
      (function() {
        var BUILD_REV = '2026.11.05-v61-self-healing-pwa';
        window.__APP_BUILD_REV__ = BUILD_REV;
        try {
          localStorage.setItem('app_build_rev', BUILD_REV);
        } catch (e) {}

        function recoverFromStaleCache(reason) {
          if (typeof navigator !== 'undefined' && !navigator.onLine) return;
          try {
            var guardKey = 'pwa_recover_' + BUILD_REV;
            if (sessionStorage.getItem(guardKey) === '1') return;
            sessionStorage.setItem(guardKey, '1');
          } catch (e) {}

          var p1 = ('caches' in window)
            ? caches.keys().then(function(keys) {
                return Promise.all(keys.map(function(k) { return caches.delete(k); }));
              }).catch(function() {})
            : Promise.resolve();

          var p2 = ('serviceWorker' in navigator)
            ? navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister().catch(function() {}); }));
              }).catch(function() {})
            : Promise.resolve();

          Promise.all([p1, p2]).then(function() {
            window.location.replace(window.location.pathname + '?_v=' + Date.now());
          });
        }

        // Catch failed module script or stylesheet loads (e.g. outdated chunk hashes)
        window.addEventListener('error', function(event) {
          var target = event && event.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var src = target.src || target.href || '';
            if (src.indexOf('/assets/') !== -1) {
              recoverFromStaleCache('asset-error');
            }
          }
        }, true);

        // Boot watchdog: if React hasn't mounted within 10 seconds, auto-heal caches & SW
        setTimeout(function() {
          var root = document.getElementById('root');
          if (!window.__LA_SOLUCION_MOUNTED__ && (!root || !root.firstElementChild)) {
            recoverFromStaleCache('boot-watchdog');
          }
        }, 10000);

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'SW_ACTIVATED' && event.data.version) {
              if (window.__APP_BUILD_REV__ && event.data.version !== window.__APP_BUILD_REV__) {
                var reloadKey = 'sw_activated_' + event.data.version;
                if (sessionStorage.getItem(reloadKey) !== '1') {
                  sessionStorage.setItem(reloadKey, '1');
                  window.location.replace(window.location.pathname + '?_v=' + event.data.version);
                }
              }
            }
          });

          var registerAppSW = function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
              .then(function(reg) {
                reg.update().catch(function() {});
              })
              .catch(function() {});
          };
          registerAppSW();
          if (document.readyState !== 'complete') {
            window.addEventListener('load', registerAppSW);
          }
        }
      })();
    </script>

    <script>
      // Filter out expected/benign Vite HMR websocket reconnection notices in sandboxed dev environment only
      (function() {
        var isDevEnv = window.location.hostname === 'localhost' || 
          window.location.hostname === '127.0.0.1' || 
          window.location.hostname.indexOf('webcontainer') !== -1 || 
          window.location.hostname.indexOf('ai.studio') !== -1;
        if (!isDevEnv) return;

        function shouldSuppress(args) {
          try {
            for (var i = 0; i < args.length; i++) {
              var str = typeof args[i] === 'string' ? args[i] : (args[i] && args[i].message ? args[i].message : String(args[i]));
              if (str && (str.indexOf('[vite]') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('failed to connect to websocket') !== -1)) {
                return true;
              }
            }
          } catch(e) {}
          return false;
        }

        ['error', 'warn', 'info', 'log'].forEach(function(method) {
          var orig = console[method];
          console[method] = function() {
            if (shouldSuppress(arguments)) return;
            return orig.apply(console, arguments);
          };
        });

        window.addEventListener('error', function(event) {
          if (event && event.message && (event.message.indexOf('[vite]') !== -1 || event.message.indexOf('WebSocket') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var reasonStr = typeof event.reason === 'string' ? event.reason : (event.reason.message || String(event.reason));
            if (reasonStr && (reasonStr.indexOf('[vite]') !== -1 || reasonStr.indexOf('WebSocket') !== -1)) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }
        }, true);
      })();
    </script>
  </head>
